<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - AI Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #videoFeed {
            width: 100%;
            display: block;
        }

        .status-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a href="/" class="navbar-brand mb-0 h1">🎓 AI Attendance System</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h2 class="mb-4">📸 Face the Camera</h2>

                <div class="video-container">
                    <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Video Feed">
                    <div class="status-overlay" id="statusText">
                        Looking for face...
                    </div>
                </div>

                <div class="mt-4">
                    <a href="/" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">✅ Attendance Marked!</h5>
                </div>
                <div class="modal-body text-center p-4">
                    <h4 id="studentName">Student Name</h4>
                    <p class="text-muted" id="timestamp">Time</p>
                    <div class="mt-3">
                        <a href="/dashboard" class="btn btn-primary">View Dashboard</a>
                        <a href="/" class="btn btn-outline-secondary">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const statusText = document.getElementById('statusText');
        const successModal = new bootstrap.Modal(document.getElementById('successModal'));
        let checkInterval;

        function checkStatus() {
            fetch('/api/attendance_status')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'marked') {
                        clearInterval(checkInterval);
                        document.getElementById('studentName').textContent = data.student;
                        document.getElementById('timestamp').textContent = data.timestamp;
                        statusText.textContent = '✅ Attendance Marked!';
                        statusText.style.background = 'rgba(40, 167, 69, 0.9)';
                        successModal.show();
                    } else if (data.status === 'already_marked') {
                        clearInterval(checkInterval);
                        document.getElementById('studentName').textContent = data.student;
                        document.getElementById('timestamp').textContent = "Already marked today";
                        statusText.textContent = '⚠️ Already Marked Today';
                        statusText.style.background = 'rgba(255, 193, 7, 0.9)';
                        successModal.show();
                    } else if (data.status === 'verifying') {
                        statusText.textContent = data.message || 'Please Blink to Verify...';
                        statusText.style.background = 'rgba(255, 193, 7, 0.9)'; // Yellow
                    } else if (data.status === 'recognizing') {
                        if (data.student) {
                            statusText.textContent = data.message || `Found: ${data.student}`;
                            statusText.style.background = 'rgba(0, 123, 255, 0.7)';
                        } else {
                            statusText.textContent = data.message || 'Looking for face...';
                            statusText.style.background = 'rgba(0,0,0,0.7)';
                        }
                    }
                })
                .catch(err => console.error(err));
        }

        // Check status every 1 second
        checkInterval = setInterval(checkStatus, 1000);
    </script>
</body>

</html>
